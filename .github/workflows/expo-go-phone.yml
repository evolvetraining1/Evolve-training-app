name: Verify published Expo Go phone link
on:
  push:
    branches: [test/expo-go-phone-20260924]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expo-go-phone-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve official Expo Go URL and verify published iOS update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, os, pathlib
          project = "351fbc52-60ff-48eb-920f-cc72354e2ccb"
          group = "8486b11f-fd6e-47ac-a099-e9c987bf8596"
          query = urllib.parse.urlencode(dict(projectId=project, groupId=group, format="url"))
          with urllib.request.urlopen("https://qr.expo.dev/eas-update?" + query, timeout=25) as r:
              url = r.read().decode().strip()
          assert url.startswith(("exp://", "exps://")), "Expected Expo Go URL"
          print("EXPO_GO_URL=" + url)
          endpoint = "https://u.expo.dev/" + project + "/group/" + group
          headers = {"expo-platform": "ios", "expo-runtime-version": "0.2.0", "expo-protocol-version": "1", "accept": "application/expo+json,application/json"}
          request = urllib.request.Request(endpoint, headers=headers)
          try:
              response = urllib.request.urlopen(request, timeout=25)
          except urllib.error.HTTPError as e:
              if e.code not in (401,403): raise
              headers["Authorization"] = "Bearer " + os.environ["EXPO_TOKEN"]
              response = urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers), timeout=25)
          with response as r:
              payload = r.read()
              content_type = r.headers.get("content-type", "")
              print("MANIFEST_STATUS=" + str(r.status))
              print("MANIFEST_CONTENT_TYPE=" + content_type)
          manifest = json.loads(payload)
          extra = manifest.get("extra", {})
          print("UPDATE_ID=" + str(manifest.get("id")))
          print("PROJECT_NAME=" + str(extra.get("expoClient", {}).get("name")))
          print("SDK_VERSION=" + str(extra.get("expoClient", {}).get("sdkVersion")))
          assert manifest.get("id") == "01a0c8f0-ec1a-79f4-9468-db2fddc4cd50", "Unexpected iOS update"
          pathlib.Path("published-phone-link.json").write_text(json.dumps(dict(url=url, projectId=project, groupId=group, iosUpdateId=manifest["id"])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-expo-go-phone-link
          path: published-phone-link.json
          retention-days: 1
