name: Temporary Expo Go phone preview
on:
  push:
    branches: [test/expo-go-phone-20260924]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expo-go-phone-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://lwkeclsloqjruhorhbjp.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7HOyCwwt2tBXPN3D0EtGiQ_bALaYOs1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app and tunnel dependencies
        run: |
          npm ci
          npm install --global @expo/ngrok@4.1.3
      - name: Start temporary Expo Go preview
        run: |
          mkdir -p /tmp/expo-phone-preview
          npx expo whoami > /tmp/expo-phone-preview/account.txt
          nohup npx expo start --go --tunnel --port 8081 > /tmp/expo-phone-preview/server.log 2>&1 &
          echo $! > /tmp/expo-phone-preview/server.pid
          python3 - <<'PY'
          import json, time, urllib.request, pathlib
          folder = pathlib.Path("/tmp/expo-phone-preview")
          for attempt in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8081/_expo/open?platform=ios&runtime=expo", timeout=3) as r:
                      info = json.load(r)
                  url = info["url"]
                  if not url.startswith(("exp://", "exps://")) or ".exp.direct" not in url:
                      raise ValueError("Tunnel not ready")
                  remote = url.replace("exp://", "https://", 1).replace("exps://", "https://", 1)
                  with urllib.request.urlopen(remote + "/_expo/open?platform=ios&runtime=expo", timeout=10) as r:
                      if json.load(r).get("url") != url:
                          raise ValueError("Public preview URL did not match")
                  info.update(readyAt=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                              expiresAt=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(time.time()+1200)),
                              account=(folder/"account.txt").read_text().strip())
                  (folder/"preview.json").write_text(json.dumps(info, indent=2))
                  print("Temporary Expo Go preview is ready.")
                  break
              except Exception:
                  time.sleep(2)
          else:
              print((folder/"server.log").read_text()[-6000:])
              raise SystemExit("Preview could not start")
          PY
      - name: Make phone link available
        uses: actions/upload-artifact@v4
        with:
          name: expo-go-phone-link
          path: /tmp/expo-phone-preview/preview.json
          retention-days: 1
          if-no-files-found: error
      - name: Keep preview available for 20 minutes
        run: |
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            kill -0 "$(cat /tmp/expo-phone-preview/server.pid)" || exit 1
            sleep 15
          done
      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/expo-phone-preview/server.pid ]; then
            kill "$(cat /tmp/expo-phone-preview/server.pid)" 2>/dev/null || true
          fi
