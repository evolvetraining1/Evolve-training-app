name: Typecheck

on:
  pull_request:
  push:
    branches:
      - stabilisation-autonome

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Session and WOD regression tests
        run: node scripts/test-session-flow.cjs

      - name: Superset prescription and rendering regression tests
        run: node scripts/test-exercise-groups.cjs


      - name: Nutrition search and photo regression tests
        run: node scripts/test-nutrition.cjs

      - name: Meal photo service contract tests
        run: node scripts/test-meal-photo-service.cjs
